name: Compteur menaces (URLhaus FR)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compteur-menaces
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Générer le JSON
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
        run: python3 .github/scripts/urlhaus_fr_counter.py "$RUNNER_TEMP/cyber-counter.json"
      - name: Publier sur la branche data (1 seul commit)
        run: |
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cp cyber-counter.json pub/
          cd pub
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyber-counter.json
          git commit -q -m "Compteur menaces"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
